name: Deploy Portfolio Setup Operator

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file with secrets
        env:
          GPASS: ${{ secrets.GPASS }}
          WPMAIL: ${{ secrets.WPMAIL }}
          WPPASS: ${{ secrets.WPPASS }}
          YAMIXEMAIL: ${{ secrets.YAMIXEMAIL }}
          YAMIXPASS: ${{ secrets.YAMIXPASS }}
          SEEMAIL: ${{ secrets.SEEMAIL }}
          SEPASS: ${{ secrets.SEPASS }}
          SERANKING_API_KEY: ${{ secrets.SERANKING_API_KEY }}
          SECOOKIES: ${{ secrets.SERANKING_COOKIES_B64 }}
          DMCAUSER: ${{ secrets.DMCAUSER }}
          DMCAPASS: ${{ secrets.DMCAPASS }}
        run: |
          b64() { printf '%s' "$1" | base64 -w0; }
          {
            echo "GOOGLE_PASSWORD_B64=$(b64 "$GPASS")"
            echo "MANAGEWP_EMAIL=$WPMAIL"
            echo "MANAGEWP_PASSWORD_B64=$(b64 "$WPPASS")"
            echo "YAMIX_EMAIL=$YAMIXEMAIL"
            echo "YAMIX_PASSWORD_B64=$(b64 "$YAMIXPASS")"
            echo "SERANKING_EMAIL=$SEEMAIL"
            echo "SERANKING_PASSWORD_B64=$(b64 "$SEPASS")"
            echo "SERANKING_API_KEY=$SERANKING_API_KEY"
            echo "SERANKING_COOKIES_B64=$(printf '%s' "$SECOOKIES" | tr -d '\n\r')"
            echo "DMCA_BASE_URL=https://dmca.bestonlinecasinodownload.com"
            echo "DMCA_USER=$DMCAUSER"
            echo "DMCA_PASSWORD_B64=$(b64 "$DMCAPASS")"
          } > operator-tool/.env

      - name: Sync Files to OVH VPS
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.OVH_SERVER_IP }}
          REMOTE_USER: "ubuntu"
          SOURCE: "operator-tool/"
          TARGET: "/opt/portfolio-setup-operator"
          EXCLUDE: "/data/"
          ARGS: "-rlgoDzvO --delete"

      - name: Rebuild and Restart Docker Container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OVH_SERVER_IP }}
          username: "ubuntu"
          key: ${{ secrets.OVH_SSH_KEY }}
          script: |
            cd /opt/portfolio-setup-operator
            docker compose down
            docker compose up -d --build
