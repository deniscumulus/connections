name: Deploy Portfolio Setup Operator

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Files to OVH VPS
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.OVH_SERVER_IP }}
          REMOTE_USER: "ubuntu"
          SOURCE: "operator-tool/"
          TARGET: "/opt/portfolio-setup-operator"
          EXCLUDE: "/data/"
          ARGS: "-rlgoDzvO --delete"

      - name: Rebuild and Restart Docker Container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OVH_SERVER_IP }}
          username: "ubuntu"
          key: ${{ secrets.OVH_SSH_KEY }}
          script: |
            cd /opt/portfolio-setup-operator
            export GOOGLE_PASSWORD="${{ secrets.GPASS }}"
            export MANAGEWP_EMAIL="${{ secrets.WPMAIL }}"
            export MANAGEWP_PASSWORD="${{ secrets.WPPASS }}"
            export YAMIX_EMAIL="${{ secrets.YAMIXEMAIL }}"
            export YAMIX_PASSWORD="${{ secrets.YAMIXPASS }}"
            export SERANKING_EMAIL="${{ secrets.SEEMAIL }}"
            export SERANKING_PASSWORD="${{ secrets.SEPASS }}"
            docker compose down
            docker compose up -d --build
