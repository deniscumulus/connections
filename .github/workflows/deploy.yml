name: Deploy Portfolio Setup Operator

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Files to OVH VPS
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.OVH_SERVER_IP }}
          REMOTE_USER: "ubuntu"
          # SOURCE: Directs the sync to pull strictly from the subfolder in your repo
          SOURCE: "operator-tool/"
          TARGET: "/opt/portfolio-setup-operator"
          # EXCLUDE: Prevent wiping out active runtime data, logs, and the custom .env configuration
          EXCLUDE: "/data/"
          ARGS: "-rlgoDzvO --delete"
      - name: Create .env file on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OVH_SERVER_IP }}
          username: "ubuntu"
          key: ${{ secrets.OVH_SSH_KEY }}
          script: |
            cd /opt/portfolio-setup-operator
            cat > .env << 'EOF'
            GOOGLE_PASSWORD=${{ secrets.GOOGLE_PASSWORD }}
            MANAGEWP_EMAIL=${{ secrets.MANAGEWP_EMAIL }}
            MANAGEWP_PASSWORD=${{ secrets.MANAGEWP_PASSWORD }}
            YAMIX_EMAIL=${{ secrets.YAMIX_EMAIL }}
            YAMIX_PASSWORD=${{ secrets.YAMIX_PASSWORD }}
            SERANKING_EMAIL=${{ secrets.SERANKING_EMAIL }}
            SERANKING_PASSWORD=${{ secrets.SERANKING_PASSWORD }}
            EOF

      - name: Rebuild and Restart Docker Container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OVH_SERVER_IP }}
          username: "ubuntu"
          key: ${{ secrets.OVH_SSH_KEY }}
          script: |
            cd /opt/portfolio-setup-operator
            # Rebuild using the freshly synced code files
            docker compose down
            docker compose up -d --build
