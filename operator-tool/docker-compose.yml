services:
  portfolio-setup-operator:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4173
      DATA_DIR: /app/data
      PLAYWRIGHT_BROWSERS_PATH: /app/.playwright
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD}
      BIGQUERY_CLOUD_PROJECT_ID: "${BIGQUERY_CLOUD_PROJECT_ID:-son-gcloud-452110-e8}"
      BIGQUERY_DATA_LOCATION: "${BIGQUERY_DATA_LOCATION:-Frankfurt (europe-west3)}"
      GOOGLE_EMAIL: ${GOOGLE_EMAIL}
      GOOGLE_PASSWORD: ${GOOGLE_PASSWORD}
      MANAGEWP_EMAIL: ${MANAGEWP_EMAIL}
      MANAGEWP_PASSWORD: ${MANAGEWP_PASSWORD}
      YAMIX_EMAIL: ${YAMIX_EMAIL}
      YAMIX_PASSWORD: ${YAMIX_PASSWORD}
      SERANKING_EMAIL: ${SERANKING_EMAIL}
      SERANKING_PASSWORD: ${SERANKING_PASSWORD}
    ports:
      - "4173:4173"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4173/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  portfolio-setup-worker:
    build: .
    command: ["node", "worker.mjs"]
    restart: unless-stopped
    depends_on:
      - portfolio-setup-operator
    env_file: .env
    environment:
      WORKER_API_BASE: "http://portfolio-setup-operator:4173"
      PLAYWRIGHT_BROWSERS_PATH: /app/.playwright
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD}
      WORKER_POLL_INTERVAL_MS: "15000"
      BIGQUERY_CLOUD_PROJECT_ID: "${BIGQUERY_CLOUD_PROJECT_ID:-son-gcloud-452110-e8}"
      BIGQUERY_DATA_LOCATION: "${BIGQUERY_DATA_LOCATION:-Frankfurt (europe-west3)}"
      GOOGLE_EMAIL: ${GOOGLE_EMAIL}
      GOOGLE_PASSWORD: ${GOOGLE_PASSWORD}
      MANAGEWP_EMAIL: ${MANAGEWP_EMAIL}
      MANAGEWP_PASSWORD: ${MANAGEWP_PASSWORD}
      YAMIX_EMAIL: ${YAMIX_EMAIL}
      YAMIX_PASSWORD: ${YAMIX_PASSWORD}
      SERANKING_EMAIL: ${SERANKING_EMAIL}
      SERANKING_PASSWORD: ${SERANKING_PASSWORD}
